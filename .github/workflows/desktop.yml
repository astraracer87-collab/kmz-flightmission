name: Desktop-Programm bauen (Windows)

# Baut aus derselben index.html wie die App das Windows-Programm für Koordinatoren.
# Erwartet im Repo (flach hochgeladen): index.html, ic_launcher.png und desktop.zip (Ordner „desktop“ gepackt).
# Mac ist herausgenommen (Mac-Rechner bei GitHub hängen oft lange in der Warteschlange, App startete auf dem Mac nicht zuverlässig).
on:
  push:
    branches: ['**']
    paths: ['index.html', 'desktop.zip', 'ic_launcher.png', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

# Ein neuer Lauf bricht einen noch laufenden/wartenden alten ab
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Dateien einsortieren
        run: |
          set -e
          rm -rf build-desktop && mkdir build-desktop
          unzip -q desktop.zip -d build-desktop
          D=build-desktop/desktop
          mkdir -p $D/app
          cp index.html $D/app/index.html
          cp $D/icon.png $D/app/icon.png

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        working-directory: build-desktop/desktop
        run: npm install --no-audit --no-fund

      - name: Selbsttest (Server-Module)
        working-directory: build-desktop/desktop
        run: node test/run.js

      - name: Programm bauen (Windows)
        working-directory: build-desktop/desktop
        run: npx electron-builder --win nsis portable --x64 --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: Mission-Kitzrettung-Windows
          path: build-desktop/desktop/dist/*.exe

      - name: Im Release „desktop“ veröffentlichen
        working-directory: build-desktop/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Windows: „Mission-Kitzrettung-Windows-Installation.exe“ (mit Startmenü-Eintrag) oder „…-ohne-Installation.exe“ (direkt starten)."
          TITLE="Mission Kitzrettung – Desktop (Windows) – Build ${{ github.run_number }}"
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES" --latest=false
          gh release edit desktop --title "$TITLE" --notes "$NOTES" --latest=false   # „Latest“ bleibt bei der APK
          # alte Mac-Dateien aus dem Release entfernen
          for a in $(gh release view desktop --json assets -q '.assets[].name' | grep -i '\.dmg$'); do gh release delete-asset desktop "$a" --yes || true; done
          gh release upload desktop dist/*.exe --clobber
