name: APK bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flach hochgeladene Dateien einsortieren
        run: |
          set -e
          mkdir -p app/src/main/java/de/olh/kmzmission app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          [ -f app-build.gradle ]     && cp app-build.gradle app/build.gradle
          [ -f kmz.keystore ]         && cp kmz.keystore app/kmz.keystore
          [ -f AndroidManifest.xml ]  && cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f MainActivity.java ]    && cp MainActivity.java app/src/main/java/de/olh/kmzmission/MainActivity.java
          [ -f index.html ]           && cp index.html app/src/main/assets/index.html
          if [ -f ic_launcher.png ]; then
            # Logo in alle Dichten, damit kein altes Symbol übrig bleibt
            rm -f app/src/main/res/mipmap-*/ic_launcher*.png app/src/main/res/mipmap-*/ic_launcher*.webp
            cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          find app -type f | sort

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleFullDebug assembleLiteDebug --no-daemon --stacktrace

      - name: APKs umbenennen
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk Mission-Kitzrettung.apk
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk Kitzrettung-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mission-Kitzrettung
          path: |
            Mission-Kitzrettung.apk
            Kitzrettung-Lite.apk

      - name: Als Release "latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mission-Kitzrettung.apk Kitzrettung-Lite.apk --target "${{ github.sha }}" \
            --title "Mission Kitzrettung – Build ${{ github.run_number }}" \
            --notes "Automatischer Build. Mission-Kitzrettung.apk = volle App, Kitzrettung-Lite.apk = vereinfachte App. Beide lassen sich gleichzeitig auf der DJI RC installieren."
