plugins {
    id 'com.android.application'
}

android {
    namespace 'de.olh.kmzmission'
    compileSdk 34

    defaultConfig {
        applicationId 'de.olh.kmzmission'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Zwei Apps aus demselben Code: volle App und Lite-App (eigener Name, eigenes Paket – beide gleichzeitig installierbar)
    flavorDimensions 'variante'
    productFlavors {
        full {
            dimension 'variante'
            resValue 'string', 'app_name', 'Mission Kitzrettung'
        }
        lite {
            dimension 'variante'
            applicationIdSuffix '.lite'
            resValue 'string', 'app_name', 'Kitzrettung Lite'
        }
    }

    // Fester Schlüssel, damit Updates ohne Deinstallation installiert werden können
    signingConfigs {
        fixed {
            storeFile file('kmz.keystore')
            storePassword 'kmzmission'
            keyAlias 'kmz'
            keyPassword 'kmzmission'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Kompatibel mit dem alten Workflow (assembleDebug + cp app/build/outputs/apk/debug/app-debug.apk):
// die volle App zusätzlich unter dem alten Namen ablegen. Die Lite-APK liegt unter apk/lite/debug/app-lite-debug.apk.
tasks.matching { it.name == 'assembleFullDebug' }.configureEach { t ->
    t.doLast {
        copy {
            from layout.buildDirectory.file('outputs/apk/full/debug/app-full-debug.apk')
            into layout.buildDirectory.dir('outputs/apk/debug')
            rename { 'app-debug.apk' }
        }
    }
}
